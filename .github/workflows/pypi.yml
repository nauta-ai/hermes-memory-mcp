name: Publish hermes-memory-mcp to PyPI

on:
  push:
    tags: ["v*.*.*", "v*.*.*a*", "v*.*.*b*", "v*.*.*rc*"]
  workflow_dispatch:

# Permissions: only the upload job needs write to the PyPI account via the
# PYPI_API_TOKEN secret. No need to touch the GitHub repo itself.
permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify dist artifacts
        run: |
          ls -la dist/
          python -m pip install --upgrade twine
          twine check dist/*

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hermes-memory-mcp-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/p/hermes-memory-mcp
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: hermes-memory-mcp-dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install twine
        run: python -m pip install --upgrade twine

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --non-interactive --skip-existing dist/*
