[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-memory-mcp"
version = "0.1.0a2"
description = "Local-first MCP server that gives AI coding agents persistent, cited memory of their project's notes, decisions, commits, and logs."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "David Nauta", email = "david@nautaai.com" }]
keywords = ["mcp", "model-context-protocol", "ai-agents", "claude-code", "local-first", "memory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=1.0.0",
  "pydantic>=2.0",
  "watchfiles>=0.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
hermes-memory = "hermes_memory_mcp.cli:main"
hermes-memory-mcp = "hermes_memory_mcp.server:main"

[project.urls]
Homepage = "https://nautaai.com/claude-code-amnesia"
Repository = "https://github.com/nauta-ai/hermes-memory-mcp"
Issues = "https://github.com/nauta-ai/hermes-memory-mcp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
